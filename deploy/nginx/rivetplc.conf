# RIVET COMPANY — nginx site for the VPS.
# Install it (docs/Deployment-VPS.md, step 6), then run certbot, which adds the
# HTTPS (443) listeners and certificates to these blocks automatically.
# `server_tokens off` is set globally by setup-server.sh.

# www.rivetplc.com -> rivetplc.com (one canonical domain for Google)
server {
    listen 80;
    listen [::]:80;
    server_name www.rivetplc.com;
    return 301 https://rivetplc.com$request_uri;
}

# Website (Next.js on 127.0.0.1:3000)
server {
    listen 80;
    listen [::]:80;
    server_name rivetplc.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (not append) so visitors cannot fake their IP for rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# API (Express on 127.0.0.1:4000): the admin dashboard and image uploads call it directly.
server {
    listen 80;
    listen [::]:80;
    server_name api.rivetplc.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Admin live notifications (Server-Sent Events): unbuffered, long-lived.
    location = /api/events {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
