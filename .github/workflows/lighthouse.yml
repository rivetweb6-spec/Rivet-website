name: Lighthouse CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse (90+)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The audited pages are rendered from API data, so Lighthouse needs a real
    # API and database behind the web app (same setup as the E2E job).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rivet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rivet?schema=public
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare database
        run: |
          pnpm db:generate
          pnpm --filter @rivet/api prisma:deploy
          pnpm db:seed

      - name: Build and start API
        run: |
          pnpm --filter @rivet/api build
          nohup pnpm --filter @rivet/api start > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/api/health && exit 0
            sleep 2
          done
          echo "API did not become healthy"; cat api.log; exit 1

      - name: Build web
        run: pnpm --filter @rivet/web build

      - name: Run Lighthouse CI
        run: pnpm --filter @rivet/web lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
